ht:12px;background:#050505;border-radius:50%}.heart:before{top:-6px;left:0}.heart:after{top:0;left:6px}.broken{position:absolute;z-index:11;right:16px;top:12px;color:#050505;font-size:20px;opacity:0}.envelope.open .broken{opacity:1}.open-note{position:absolute;left:50%;bottom:-42px;transform:translateX(-50%);color:var(--muted);font-size:.9rem;letter-spacing:.08em;white-space:nowrap}

<body>

<section class="intro" id="intro"><div class="intro-inner"><span>Tous les bonne nuit que je n’ai pas pu te dire jusqu’à présent…</span><span>et ceux que je ne pourrai probablement jamais prononcer.</span><span>Pourtant ils existent.</span><small>clique pour continuer</small></div></section>

<script>
const currentLetter={title:'Pour Valentina,',body:`Tu m’avais laissé entendre, plus ou moins subtilement, qu’écrire encore serait une mauvaise idée.

Alors évidemment, me voilà.

Pas parce que c’est intelligent.

Ni particulièrement digne.

Mais parce qu’il existe quelque chose d’assez irritant dans le fait qu’une personne trouve encore le moyen d’occuper un espace précis de ton esprit alors même que, rationnellement, elle ne devrait probablement plus y avoir la moindre place.

Et je déteste profondément ce constat.

Vraiment.

Pas cette petite irritation légère qu’on oublie après quelques minutes.

Non.

Quelque chose de plus tenace.

Le genre de présence absurde qui refuse obstinément de quitter ton esprit alors même que tout en toi préférerait sincèrement le contraire.

Oui.

Je parle bien de toi.

Et ce qui rend ça légèrement plus insupportable, c’est cette pensée, qu’il y a peut-être actuellement, ou récemment, quelque part autour de toi, quelqu’un d’une médiocrité presque offensante...

Et quitte à écrire une lettre qu’on m’avait implicitement déconseillé d’écrire, autant éviter l’hypocrisie.

Bref.

Il m’arrive encore de penser à toi.

Je trouve ça profondément agaçant.

Et le fait d’imaginer que l’univers ait potentiellement confié ton attention à quelqu’un de banal n’aide absolument pas.

Alors oui, j’ai réécrit.

En partie parce que tu m’as dit de ne pas le faire.

Ce qui est une motivation étonnamment suffisante.

Considère ceci comme un simple rappel :

tu occupes encore un espace que tu n’aurais probablement plus dû occuper.

et je trouve ça absolument insupportable.`};
const oldLetter={title:'Ancienne lettre,',body:`J’aurais pu ne rien réécrire et laisser ça comme c’était, mais ce serait trop facile de faire comme si rien n’avait réellement existé.

Entre-temps, j’ai compris des choses, et surtout, j’ai compris pourquoi cette situation m’a autant atteint.

Tu m’as dit que je me positionnais en victime, alors que je faisais simplement ce que j’aurais dû faire depuis le début : expliquer pourquoi je m’étais fermé.

Il n’y avait aucune intention cachée derrière ça. Pas de manipulation, pas de stratégie, juste une tentative d’être honnête avec toi.

Mais avec toi, parler devient rapidement un problème, parce que tu n’as jamais réellement cherché à m’écouter. Pas au sens où on essaie de comprendre quelqu’un, mais juste assez pour répondre et préserver ta version.

Et forcément, dans ce schéma-là, tout finit par être retourné.

Donc je deviens “la victime”.

C’est plus simple comme ça.

Et surtout, ça t’évite de regarder ce qui te dérange.

Il y a quand même quelque chose que tu ne peux pas ignorer, et que je vais dire clairement cette fois.

Aujourd’hui, tu sais comment je fonctionne. Tu sais que je suis borderline. Tu sais que l’abandon, le silence, le fait de disparaître, c’est littéralement ce qu’il y a de plus violent à vivre pour moi.

Et malgré ça, tu l’as fait quand même.

Pas par erreur. Pas par maladresse.

En le sachant.

Et ça change tout.

Parce que là, on ne parle plus d’incompréhension. On parle d’un choix.

Le choix de te préserver toi, même si ça écrase complètement ce qu’il y a en face.

Et c’est là que j’ai compris quelque chose de plus simple encore. Tu ne manques pas de compréhension. Tu choisis juste quand l’utiliser.

Et quand ça ne t’arrange pas… tu préfères ne pas voir.

Parce que voir t’obligerait à reconnaître que certaines de tes réactions ne sont pas neutres, qu’elles ont un impact réel, et que tu n’es pas toujours du côté que tu penses.

Alors tu simplifies. Tu te convaincs. Et tu restes là-dedans.

Pendant que moi, j’essayais encore de construire quelque chose avec quelqu’un qui, au fond, ne regardait jamais vraiment ailleurs que vers elle-même.

Alors oui, je t’en veux.

Pas parce que tu es partie.

Mais parce que tu l’as fait en sachant exactement ce que ça impliquait pour moi, et en décidant quand même que ce n’était pas ton problème.

Et ça, c’est quelque chose que je ne peux pas ignorer.

Alors j’ai arrêté.

Pas de ressentir.

Mais d’attendre quelque chose de toi.

Parce qu’au fond, tu n’as jamais vraiment été là.

Pas comme moi je l’étais.

Et c’est peut-être ça, le plus clair maintenant.

Ce n’était pas une histoire qui s’est brisée.

C’était quelque chose qui n’a jamais existé de la même façon des deux côtés.

Et malgré tout ça… il y a encore une part de moi qui aurait voulu que ce soit différent.

Mais celle-là, je vais la laisser ici.

Sur ce site un peu idiot que j’ai pris le temps de faire pour quelqu’un qui cherchait déjà une raison de m’en vouloir.

Prends ça comme tu veux.

— quelqu’un que tu n’as jamais vraiment voulu entendre`};
const letters={current:currentLetter,old:oldLetter};const intro=document.getElementById('intro'),envWrap=document.getElementById('envelopeWrap'),env=document.getElementById('envelope'),letterWrap=document.getElementById('letterWrap'),letterBox=document.getElementById('letterBox'),title=document.getElementById('letterTitle'),body=document.getElementById('letterBody'),cursor=document.getElementById('cursor'),soundBtn=document.getElementById('soundBtn');let active='current',opened=false,started=false,goodTimer=null,music=false,audioCtx=null,intervals=[];const birth=new Date(2006,9,3),totalDays=Math.floor((new Date()-birth)/(1000*60*60*24));let goodCount=0;
const tracked=new Set();function track(n,l=''){if(window.goatcounter&&typeof window.goatcounter.count==='function')window.goatcounter.count({path:l?`/event/${n}/${l}`:`/event/${n}`,title:l?`${n}-${l}`:n,event:true})}function once(n,l=''){const k=n+':'+l;if(tracked.has(k))return;tracked.add(k);track(n,l)}
function fill(w){active=w;title.textContent=letters[w].title;body.textContent=letters[w].body;letterBox.scrollTop=0;document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.letter===w))}fill('current');
function start(){if(started)return;started=true;intro.classList.add('hide');once('intro_finished');startWords();setTimeout(()=>envWrap.classList.add('visible'),650);setTimeout(()=>{if(!opened)openLetter()},9000)}intro.addEventListener('click',start);setTimeout(start,5600);
function openLetter(){if(opened)return;opened=true;env.classList.add('open');burst(24);startMusic();track('envelope_clicked');once('opened_letter',active);setTimeout(()=>{envWrap.classList.add('hidden');letterWrap.classList.remove('closing');letterWrap.classList.add('show')},520)}env.addEventListener('click',openLetter);envWrap.addEventListener('click',openLetter);
document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{const w=b.dataset.letter;fill(w);track('letter_tab_clicked',w);once('opened_letter',w);if(letterWrap.classList.contains('show')){letterBox.classList.remove('switch');void letterBox.offsetWidth;letterBox.classList.add('switch')}else{opened=false;env.classList.remove('open');envWrap.classList.remove('hidden');envWrap.classList.add('visible');setTimeout(openLetter,350)}});
document.getElementById('closeBtn').onclick=()=>{track('closed_letter',active);letterWrap.classList.add('closing');letterWrap.classList.remove('show');setTimeout(()=>{letterWrap.classList.remove('closing');opened=false;env.classList.remove('open');envWrap.classList.remove('hidden');envWrap.classList.add('visible')},560)};
letterBox.addEventListener('scroll',()=>{const max=letterBox.scrollHeight-letterBox.clientHeight;if(max<=0)return;const p=letterBox.scrollTop/max;if(p>.35)once('read_35_percent',active);if(p>.7)once('read_70_percent',active);if(p>.92)once('read_to_bottom',active)});
function startWords(){if(goodTimer)return;for(let i=0;i<14;i++)setTimeout(()=>word('good','bonne nuit'),i*120);goodTimer=setInterval(()=>{if(document.hidden)return;if(goodCount>=totalDays)goodCount=0;goodCount++;word('good','bonne nuit');if(Math.random()<.08)word('sorry','pardon :(');if(Math.random()<.008)word('secret',Math.random()<.5?'petit chat':'tu lis encore ?')},480)}
function word(cls,txt){const e=document.createElement('div');e.className='word '+cls;e.textContent=txt;e.style.left=(Math.random()*94+3)+'vw';e.style.top=(Math.random()*90+5)+'vh';e.style.setProperty('--r',(Math.random()*50-25)+'deg');e.style.setProperty('--d',(Math.random()*.8+1.8)+'s');e.style.setProperty('--o',(Math.random()*.5+.28));e.style.setProperty('--x',(Math.random()*70-35)+'px');e.style.setProperty('--y',(Math.random()*40-24)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function burst(n){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='burst';d.innerHTML='<span>🦋</span>';d.style.setProperty('--x',(Math.random()*700-350)+'px');d.style.setProperty('--y',(Math.random()*460-230)+'px');d.style.setProperty('--r',(Math.random()*320-160)+'deg');d.style.animationDelay=i*.024+'s';document.getElementById('burstLayer').appendChild(d);setTimeout(()=>d.remove(),2100)}}
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});document.addEventListener('touchmove',e=>{const t=e.touches[0];if(t){cursor.style.left=t.clientX+'px';cursor.style.top=t.clientY+'px'}},{passive:true});document.addEventListener('dblclick',()=>{if(!letterWrap.classList.contains('show')){word('secret','petit chat');burst(6);track('double_click_easter_egg')}});
setTimeout(()=>once('stayed_15s'),15000);setTimeout(()=>once('stayed_30s'),30000);setTimeout(()=>once('stayed_60s'),60000);setTimeout(()=>once('stayed_120s'),120000);document.addEventListener('visibilitychange',()=>track(document.visibilityState==='hidden'?'left_or_tab_hidden':'returned_to_tab'));window.addEventListener('beforeunload',()=>track('page_closed'));
soundBtn.onclick=()=>{music?stopMusic():startMusic()};function startMusic(){if(music)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const master=audioCtx.createGain();master.gain.value=.028;master.connect(audioCtx.destination);const notes=[220,261.63,329.63,392,329.63,261.63];let s=0;const it=setInterval(()=>{if(!music)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=notes[s++%notes.length];g.gain.setValueAtTime(0,audioCtx.currentTime);g.gain.linearRampToValueAtTime(.045,audioCtx.currentTime+.18);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+2.6);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+2.7)},1200);intervals.push(it);music=true;once('music_started');soundBtn.textContent='son : on'}catch(e){}}function stopMusic(){music=false;intervals.forEach(clearInterval);intervals=[];soundBtn.textContent='son : off';track('music_stopped')}
const rain=document.getElementById('rain'),rctx=rain.getContext('2d'),fx=document.getElementById('fx'),fctx=fx.getContext('2d');let drops=[],moths=[];function resize(){const d=window.devicePixelRatio||1;[rain,fx].forEach(c=>{c.width=innerWidth*d;c.height=innerHeight*d});rctx.setTransform(d,0,0,d,0,0);fctx.setTransform(d,0,0,d,0,0);drops=Array.from({length:Math.floor(innerWidth/12)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:Math.random()*10+8,s:Math.random()*3.5+2.5,a:Math.random()*.16+.07}));moths=Array.from({length:Math.min(8,Math.floor(innerWidth/150))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*.4+.55,a:Math.random()*.22+.16,vx:Math.random()*.9+.45,vy:Math.random()*.2-.1,p:Math.random()*6.28}))}addEventListener('resize',resize);resize();let lr=0,lf=0;function loopRain(t){if(t-lr>32){lr=t;rctx.clearRect(0,0,innerWidth,innerHeight);drops.forEach(d=>{rctx.globalAlpha=d.a;rctx.fillStyle='#d8c8b1';rctx.fillRect(Math.round(d.x),Math.round(d.y),1,Math.round(d.l));d.y+=d.s;d.x+=.25;if(d.y>innerHeight+24){d.y=-24;d.x=Math.random()*innerWidth}})}requestAnimationFrame(loopRain)}function loopFx(t){if(t-lf>45){lf=t;fctx.clearRect(0,0,innerWidth,innerHeight);moths.forEach(m=>{m.p+=.025;m.x+=m.vx+Math.sin(m.p)*.25;m.y+=m.vy+Math.cos(m.p)*.12;if(m.x>innerWidth+80){m.x=-80;m.y=Math.random()*innerHeight}fctx.save();fctx.translate(m.x,m.y);fctx.scale(m.s,m.s);fctx.globalAlpha=m.a;fctx.font='26px serif';fctx.shadowColor='rgba(0,0,0,.35)';fctx.shadowBlur=6;fctx.fillText('🦋',0,0);fctx.restore()})}requestAnimationFrame(loopFx)}requestAnimationFrame(loopRain);requestAnimationFrame(loopFx);
